<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Hunter</title>
    <!-- font-awsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- manrope-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        .manrope{
            font-family: "Manrope", serif;
        }
    </style>
<!-- tailwind custom colour -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clifford: '#da373d',
          }
        }
      }
    }
  </script>

</head>
<body class="manrope">
    <header class="container mx-auto">
      <div class="flex flex-col justify-center items-center gap-2">
        <h2 class=" text-xl md:text-3xl font-bold text-center mt-6">Search Your Phone</h2>
        <div class="flex">
        <input id="search-feild" type="search" placeholder="Type here" class="input bg-[#100F0F0D] w-72" />
        <button onclick="handleSearch()"  class="btn btn-primary">Search</button>
      </div>
      </div>
    </header>

    <main class="container mx-auto mt-6">
      <section>
        <!-- loading spinner -->
         <div id="loading-spinner" class="text-center my-40 hidden">
          <span class="loading loading-spinner loading-lg"></span>
         </div>
        <div id="phone-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          
        </div>
        <!-- show all button -->
         <div class="flex justify-center pt-4">
         <div id="show-all-btn-c" class="hidden">
          <button onclick="showAll()" class="btn btn-primary">Sow All</button>
         </div>
        </div>
      </section>

      <!-- show details model -->
       <!-- Open the modal using ID.showModal() method -->

<dialog id="show_details_model" class="">
  <div class="modal-box">
    
   <div id="details-box" class="flex flex-col items-start justify-center gap-2 card bg-white w-80  p-4">

   </div>
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
</dialog>

    </main>

    <script src="/js/phone.js"></script>

    <footer>

    </footer>
    
</body>
</html>
